<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're in — K-pop Dance Trends</title>
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #171a23;
    --card-border: #262b38;
    --text: #f1f2f6;
    --text-dim: #9aa1b4;
    --accent: #ff3d77;
    --accent-2: #7c5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 64px 20px;
    text-align: center;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 {
    font-size: 28px;
    margin: 0 0 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { color: var(--text-dim); line-height: 1.5; margin-bottom: 32px; }
  .go-btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 10px;
  }
  .go-btn:hover { background: var(--accent-2); }
  .note { margin-top: 32px; font-size: 12px; }
</style>
</head>
<body>
  <main>
    <h1>You're in 🎉</h1>
    <p>
      Thanks for subscribing — here's your dashboard. It's not linked from anywhere public, so
      bookmark this page or the link below to come back each week.
    </p>
    <a class="go-btn" href="/kpop-dance-trends/dashboard/">Open the Dashboard ↗</a>
    <p class="note">
      Questions or issues with access? Reply to your payment receipt email.
    </p>
  </main>
</body>
</html>
